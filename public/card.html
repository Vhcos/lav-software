<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Víctor Hurtado · LAV Systems</title>
  <meta name="description" content="Fundador de LAV Systems — Software inteligente a medida para empresas en Chile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0c1f35;
      --navy-mid: #112840;
      --navy-light: #163352;
      --accent: #0891b2;
      --accent-light: #22d3ee;
    }

    html, body {
      min-height: 100%;
      background: var(--navy);
      font-family: 'Inter', -apple-system, sans-serif;
      color: white;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
    }

    .card {
      width: 100%;
      max-width: 420px;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      padding-top: 56px;
      padding-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(180deg, var(--navy-mid) 0%, var(--navy) 100%);
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 320px; height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(8,145,178,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .brand-badge {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .photo-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      margin-bottom: 20px;
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 8%;
      border: 2.5px solid var(--accent);
    }
    .photo-wrap::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1px solid rgba(8,145,178,0.2);
    }

    .name {
      font-size: 26px;
      font-weight: 800;
      color: white;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.15;
    }

    .title {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-align: center;
    }

    .tagline {
      margin-top: 14px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-align: center;
      line-height: 1.6;
      max-width: 260px;
    }

    /* ── ACTIONS ── */
    .actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
      padding: 0 24px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .action-icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--navy-light);
      border: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-light);
      transition: background 0.15s, transform 0.1s;
    }
    .action-btn:active .action-icon {
      background: rgba(8,145,178,0.18);
      transform: scale(0.93);
    }

    .action-label {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* ── SAVE BUTTON ── */
    .save-wrap {
      padding: 24px 24px 8px;
    }

    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 24px;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: background 0.15s, transform 0.1s;
    }
    .save-btn:active {
      background: #0e7490;
      transform: scale(0.98);
    }

    /* ── CONTACT LIST ── */
    .contact-list {
      padding: 8px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--navy-light);
      border: 1px solid rgba(255,255,255,0.05);
      text-decoration: none;
      color: white;
      transition: background 0.15s;
    }
    .contact-item:active {
      background: rgba(8,145,178,0.12);
    }
    .contact-item:first-child { border-radius: 14px 14px 4px 4px; }
    .contact-item:last-child  { border-radius: 4px 4px 14px 14px; }
    .contact-item:only-child  { border-radius: 14px; }

    .ci-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(8,145,178,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .ci-text { flex: 1; min-width: 0; }
    .ci-label {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .ci-value {
      font-size: 14px;
      font-weight: 500;
      color: white;
      margin-top: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ci-arrow {
      color: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    /* ── FOOTER ── */
    .footer {
      margin-top: auto;
      padding: 20px 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .footer-logo {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.15);
      text-transform: uppercase;
    }

    .footer-link {
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
    }
    .footer-link:active { color: var(--accent); }
  </style>
</head>
