<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Víctor Hurtado · LAV Systems</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @page { size: 85mm 55mm; margin: 0; }

    body {
      background: #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
      min-height: 100vh;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }

    /* 85mm × 55mm */
    .card {
      width: 85mm;
      height: 55mm;
      border-radius: 3.5mm;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.28);
      position: relative;
      flex-shrink: 0;
    }

    /* ── ANVERSO ─────────────────────────────────── */
    .front {
      background: #0c1f35;
      display: flex;
    }

    .photo-col {
      width: 34mm;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .photo-col img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 8%;
    }
    .photo-col::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 55%, rgba(12,31,53,0.55) 100%);
    }

    .info-col {
      flex: 1;
      padding: 5mm 5mm 4.5mm 4mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 900;
      color: white;
      letter-spacing: 0.18em;
      line-height: 1;
    }
    .brand-sub {
      font-size: 5.5px;
      color: rgba(255,255,255,0.32);
      letter-spacing: 0.45em;
      text-transform: uppercase;
      margin-top: 1.5px;
    }

    .person-name {
      font-size: 11.5px;
      font-weight: 700;
      color: white;
      line-height: 1.2;
    }
    .person-title {
      font-size: 7px;
      color: #0891b2;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 2.5px;
    }

    .contact { display: flex; flex-direction: column; gap: 2.5px; }
    .contact-line {
      font-size: 6px;
      color: rgba(255,255,255,0.52);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .ci { color: #0891b2; flex-shrink: 0; }

    .bottom-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 3mm;
    }
    .web-url {
      font-size: 7px;
      color: #0891b2;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .scan-label {
      font-size: 5px;
      color: rgba(255,255,255,0.2);
      margin-bottom: 2px;
    }
    .qr-box {
      width: 15mm;
      height: 15mm;
      background: white;
      border-radius: 1.5mm;
      padding: 1.2mm;
    }
    .qr-box img { width: 100%; height: 100%; display: block; }

    /* accent dot entre foto e info */
    .dot {
      position: absolute;
      width: 3mm; height: 3mm;
      border-radius: 50%;
      background: #0891b2;
      bottom: 4mm;
      left: 34mm;
      transform: translateX(-50%);
      opacity: 0.55;
      z-index: 2;
    }

    /* ── REVERSO ─────────────────────────────────── */
    .back {
      background: linear-gradient(140deg, #091e35 0%, #0d2d50 55%, #091e35 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .back-glow {
      position: absolute;
      width: 55mm; height: 55mm;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(8,145,178,0.14) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .back-lav {
      font-size: 22px;
      font-weight: 900;
      color: white;
      letter-spacing: 0.25em;
      position: relative;
    }
    .back-systems {
      font-size: 6.5px;
      color: rgba(255,255,255,0.32);
      letter-spacing: 0.55em;
      text-transform: uppercase;
      text-align: center;
      position: relative;
      margin-top: 1px;
    }
    .back-divider {
      width: 14mm; height: 1px;
      background: rgba(8,145,178,0.4);
      margin: 4mm auto;
      position: relative;
    }
    .back-tagline {
      font-size: 6px;
      color: rgba(255,255,255,0.2);
      text-align: center;
      position: relative;
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    /* ── PRINT ───────────────────────────────────── */
    @media print {
      body {
        background: white;
        display: block;
        min-height: auto;
        padding: 0;
      }
      .card {
        width: 85mm;
        height: 55mm;
        border-radius: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
      }
    }
  </style>
</head>
<body>

<!-- ANVERSO -->
<div class="card front">
  <div class="photo-col">
    <img src="victor.jpg" alt="Víctor Hurtado" />
  </div>
  <div class="dot"></div>
  <div class="info-col">
    <div>
      <div class="brand-name">LAV</div>
      <div class="brand-sub">Systems</div>
    </div>

    <div>
      <div class="person-name">Víctor Hurtado</div>
      <div class="person-title">Fundador</div>
    </div>

    <div>
      <div class="contact">
        <div class="contact-line">
          <svg class="ci" width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          vhurtado@grupohurtado.cl
        </div>
        <div class="contact-line">
          <svg class="ci" width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.22 1.18 2 2 0 012.18 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.91 7.09a16 16 0 006 6l.91-.91a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 14.5v2.42z"/>
          </svg>
          +569 6496 5511
        </div>
      </div>
      <div class="bottom-row">
        <div>
          <div class="scan-label">Escanea o visita</div>
          <div class="web-url">lav.software</div>
        </div>
        <div class="qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https%3A%2F%2Flav.software&margin=3&color=0c1f35" alt="QR" crossorigin="anonymous" />
        </div>
      </div>
    </div>
  </div>
</div>

<!-- REVERSO -->
<div class="card back">
  <div class="back-glow"></div>
  <div class="back-lav">LAV</div>
  <div class="back-systems">Systems</div>
  <div class="back-divider"></div>
  <div class="back-tagline">Software inteligente a medida<br>para resolver problemas reales de empresas</div>
</div>

</body>
</html>
